name: Fotufilm Android native POC

# Phase 0：只产出 FSWP pack + Android arm64 CPU AOT kernels + parity 日志。
# APK 不在 CI 构建；APK 仍用 Windows 的 Android Studio。
#
# 为什么是两个 job：
#   `fotufilm` CLI 的 `--dump-wasm-pack` 实现位于 main.swift 的 `#if canImport(ImageIO)` 块内，
#   在 Linux 上整段被替换成 fail("Image I/O requires macOS (ImageIO)")。
#   上游自己的 CI（.github/workflows/ci.yml @ 2d07c48）也是 runs-on: macos-26。
#   而 pack 内容是纯参数序列化，与平台无关，所以：
#     packs job（macOS）→ 产出 .fswp
#     android-native job（Linux）→ Halide + AOT kernels + parity，消费上面的 .fswp
#
# 与上游（DhaliwalX/fotufilm-engine @ 2d07c48）逐项核对过的事实：
#   - CLI 支持 --list-stocks / --dump-wasm-pack / --stock / --pack-size
#   - verify-android-aot.sh 依赖 tools/resolve-halide-toolchain.sh，后者**认可 HALIDE_ROOT 环境变量**
#   - verify-android-aot.sh 通过 FOTUFILM_PARITY_CLI 可跳过 `swift run` 的重复编译
#   - generate_halide_android OUTPUT_DIR [--arm32 | --host]，不传 flag = arm64 Android（正是我们要的）
#   - 子模块只有 third_party/Halide → github.com/halide/Halide，pin 58868f0c
#   - 该 pin 的 Halide CMakeLists 写 `Halide_LLVM 21...99`，即 LLVM 22 满足最低要求
#   - 该 pin 的 cmake/FindHalide_LLVM.cmake 对 WebAssembly 组件要求 find_package(LLD EXACT)
#   - stocks 通过 SwiftPM .copy("Stocks") 打包，gold200 / portra400 / trix400 均存在
#   - NDK 28.2.13676358 在 dl.google.com 的 repository2-3.xml 中存在
#   - fotufilm 可执行目标只依赖 FotufilmCore / FotufilmImaging / FotufilmEditModel，
#     **不依赖 FotufilmHalide** → macOS 上不需要装 Halide 也能 swift build

on:
  workflow_dispatch:
    inputs:
      stocks:
        description: "Space-separated stock ids"
        required: true
        default: "gold200 portra400 trix400"
      pack_size:
        description: "WIDTHxHEIGHT. Must equal the capture resolution — spatial params are baked per frame size"
        required: false
        default: "4000x3000"

permissions:
  contents: read

# 一次 run 要 45–90 分钟，重复触发只会浪费 runner 配额。
concurrency:
  group: fotufilm-android-poc-${{ github.ref }}
  cancel-in-progress: false

env:
  FOTUFILM_REPOSITORY: DhaliwalX/fotufilm-engine
  FOTUFILM_COMMIT: 2d07c48c14199be24972db760a7631dc95f74012
  LLVM_VERSION: "22"
  NDK_VERSION: "28.2.13676358"
  FOTUFILM_ROOT: third_party/fotufilm
  # 交付用的 pack 尺寸。**必须等于实际拍摄分辨率**：
  # main.swift:1123 写明 "A frame of another size needs another pack" —— 每个空间参数是
  # 毫米长度乘以该帧的 pixels-per-mm，尺寸是导出的一部分，不能事后缩放。
  # 4000x3000 = 12MP（4:3），对应 FOT-004 的验收目标。
  PACK_SIZE: ${{ inputs.pack_size || '4000x3000' }}
  # parity 脚本内部固定请求这个 stock / 尺寸
  PARITY_STOCK: example-negative-400
  PARITY_SIZE: "96x64"

jobs:
  # ---------------------------------------------------------------------------
  # pack 生产：唯一需要 ImageIO 的环节，因此放 macOS。
  # 不用 brew 装 Halide —— fotufilm 目标不依赖 FotufilmHalide，Xcode 自带的 Swift 足够。
  #
  # 为什么是 macos-26 而不是 macos-14：macos-14 自带 Xcode 15.4 / Swift 5.10，
  # 编译 FotufilmCore 时报 `MTLCompileOptions has no member 'mathMode'`（该 API 要 macOS 15 SDK），
  # 并伴随一批 "unable to type-check this expression in reasonable time"。
  # 上游自己的 ci.yml 就是 runs-on: macos-26 —— 与它对齐是这里唯一有证据支撑的选择。
  # ---------------------------------------------------------------------------
  packs:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout Pocket CCD
        uses: actions/checkout@v4

      - name: Checkout Fotufilm at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FOTUFILM_REPOSITORY }}
          ref: ${{ env.FOTUFILM_COMMIT }}
          path: third_party/fotufilm
          submodules: false
          fetch-depth: 1

      - name: Verify upstream layout
        run: |
          set -euxo pipefail
          test -f "$FOTUFILM_ROOT/Package.swift"
          test -d "$FOTUFILM_ROOT/Sources/FotufilmCore/Stocks"
          test -f "$FOTUFILM_ROOT/Sources/FotufilmCore/Stocks/gold200.json"

      - name: Toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          swift --version
          # FotufilmCore 用到 MTLCompileOptions.mathMode（macOS 15 SDK 起才有），
          # Xcode 15.4 会在编译中途炸并且报一堆 type-check 超时。这里提前拦住。
          major="$(xcodebuild -version | head -1 | sed 's/Xcode //' | cut -d. -f1)"
          if [ "$major" -lt 16 ]; then
            echo "Xcode $major is too old: FotufilmCore needs the macOS 15 SDK (Xcode 16+)" >&2
            exit 1
          fi

      - name: Build fotufilm CLI
        working-directory: ${{ env.FOTUFILM_ROOT }}
        run: |
          set -euxo pipefail
          swift build -c release --product fotufilm
          # 不加 | head，避免 pipe 吞掉非零退出码
          .build/release/fotufilm --list-stocks > stocks.txt
          wc -l stocks.txt
          head -5 stocks.txt

      - name: Dump FSWP packs
        working-directory: ${{ env.FOTUFILM_ROOT }}
        env:
          STOCKS: ${{ inputs.stocks }}
        run: |
          set -euxo pipefail
          # PACK_SIZE 来自 workflow 级 env 的表达式求值；万一没解析成字面量，这里立刻失败
          [[ "$PACK_SIZE" =~ ^[0-9]+x[0-9]+$ ]] || { echo "bad PACK_SIZE: $PACK_SIZE" >&2; exit 1; }
          # 与上游 verify-android-aot.sh 一致：显式指向 Stocks 源目录，避免依赖 SwiftPM 资源包的布局
          export FOTUFILM_STOCKS="$PWD/Sources/FotufilmCore/Stocks"
          OUT="$PWD/packs"
          mkdir -p "$OUT"

          for stock in $STOCKS; do
            .build/release/fotufilm \
              --dump-wasm-pack "$OUT/${stock}__${PACK_SIZE}.fswp" \
              --stock "$stock" --pack-size "$PACK_SIZE"
          done

          # parity 脚本会请求这一份；Linux 侧的 shim 靠文件名精确匹配
          .build/release/fotufilm \
            --dump-wasm-pack "$OUT/${PARITY_STOCK}__${PARITY_SIZE}.fswp" \
            --stock "$PARITY_STOCK" --pack-size "$PARITY_SIZE"

          ls -lh "$OUT"
          test -n "$(ls -A "$OUT")"
          # stocks.txt 放进 packs/ 一起上传，让 artifact 只有一个根，解压后是平的
          cp stocks.txt "$OUT/"

      - name: Upload packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-packs
          if-no-files-found: warn
          retention-days: 14
          # 目录路径（无通配符）→ artifact 根就是 packs/ 的内容，
          # 下载后是 packs/xxx.fswp 而不是 packs/packs/xxx.fswp。
          path: third_party/fotufilm/packs/

  # ---------------------------------------------------------------------------
  # 原生产物：Halide + Android arm64 CPU AOT kernels + parity，全部在 Linux。
  # ---------------------------------------------------------------------------
  android-native:
    needs: packs
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Pocket CCD
        uses: actions/checkout@v4

      - name: Checkout Fotufilm at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FOTUFILM_REPOSITORY }}
          ref: ${{ env.FOTUFILM_COMMIT }}
          path: third_party/fotufilm
          submodules: recursive
          fetch-depth: 1

      - name: Verify upstream layout
        run: |
          set -euxo pipefail
          test -f "$FOTUFILM_ROOT/Package.swift"
          test -f "$FOTUFILM_ROOT/tools/build-halide-linux.sh"
          test -f "$FOTUFILM_ROOT/tools/verify-android-aot.sh"
          test -f "$FOTUFILM_ROOT/tools/resolve-halide-toolchain.sh"
          test -f "$FOTUFILM_ROOT/tools/generate_halide_android.cpp"
          test -f "$FOTUFILM_ROOT/third_party/Halide/CMakeLists.txt"   # 子模块必须真的在
          for p in strict-float bool-uniforms allocation-padding readback-staging; do
            test -f "$FOTUFILM_ROOT/tools/halide-vulkan-$p.patch"
          done
          echo "upstream layout OK"

      - name: Download packs from the macOS job
        uses: actions/download-artifact@v4
        with:
          name: fotufilm-packs
          path: prebuilt-packs

      - name: Check packs
        run: |
          set -euxo pipefail
          ls -lR prebuilt-packs
          # 不写死层级：upload-artifact 会按最小公共父目录重组路径，
          # 换了 path 写法就可能多一层目录。这里按文件名找，找得到就说明没问题。
          PARITY_PACK="$(find prebuilt-packs -name "${PARITY_STOCK}__${PARITY_SIZE}.fswp" -print -quit)"
          test -n "$PARITY_PACK"
          PACK_DIR="$(cd "$(dirname "$PARITY_PACK")" && pwd)"
          echo "FOTUFILM_PACK_DIR=$PACK_DIR" >> "$GITHUB_ENV"
          echo "pack dir: $PACK_DIR"
          # 逐个校验 FSWP 头，避免把空文件或错文件往后传
          for f in "$PACK_DIR"/*.fswp; do
            head -c 4 "$f" | grep -q FSWP || { echo "not an FSWP pack: $f" >&2; exit 1; }
            echo "ok: $(basename "$f") $(wc -c < "$f") bytes"
          done

      # Halide 源码 + 编译产物约 8–10GB，托管 runner 的 / 只有 ~14GB 空闲。
      - name: Free disk space
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git curl unzip wget \
            libffi-dev libelf-dev libxml2-dev zlib1g-dev \
            libjpeg-dev libpng-dev libtiff-dev liblcms2-dev libheif-dev \
            libopenexr-dev libvulkan-dev pkg-config python3

      - name: Install LLVM
        run: |
          set -euxo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "${LLVM_VERSION}"
          # Halide 的 FindHalide_LLVM.cmake 会 find_package(Clang CONFIG) 和 find_package(LLD CONFIG)。
          # 注意 lld-NN 只是可执行文件；提供 lld/LLDConfig.cmake 的是 liblld-NN-dev，
          # 少了它会报 "Could NOT find LLD (missing: LLD_DIR)"，进而因 WebAssembly 组件判定失败
          # 而整体报 "Could NOT find Halide_LLVM (missing: WebAssembly)"。
          sudo apt-get install -y \
            "llvm-${LLVM_VERSION}-dev" "libclang-${LLVM_VERSION}-dev" \
            "clang-${LLVM_VERSION}" "lld-${LLVM_VERSION}" "liblld-${LLVM_VERSION}-dev"
          echo "LLVM_ROOT=/usr/lib/llvm-${LLVM_VERSION}" >> "$GITHUB_ENV"
          "/usr/lib/llvm-${LLVM_VERSION}/bin/llvm-config" --version
          # build-halide-linux.sh 会 grep CMakeCache 里的 NVPTX，缺了直接退出。
          "/usr/lib/llvm-${LLVM_VERSION}/bin/llvm-config" --targets-built
          # 三份 CMake config 缺任何一份，Halide 的 configure 都在 3 分钟后失败；
          # 这里提前到 3 秒内失败，且能把原因说清楚。
          for cfg in \
            "/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm/LLVMConfig.cmake" \
            "/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/clang/ClangConfig.cmake" \
            "/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/lld/LLDConfig.cmake"; do
            test -f "$cfg" || { echo "MISSING: $cfg" >&2; exit 1; }
            echo "ok: $cfg"
          done

      - name: Install Android NDK
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          test -f "$SDK_ROOT/ndk/${NDK_VERSION}/source.properties"

      # restore/save 拆开：Halide 编完立刻落缓存，
      # 这样后续步骤失败也不会丢掉这 30–60 分钟。
      - name: Restore Halide cache
        id: halide-restore
        uses: actions/cache/restore@v4
        with:
          path: third_party/fotufilm/build/halide-linux-install
          key: fotufilm-halide-${{ env.FOTUFILM_COMMIT }}-llvm${{ env.LLVM_VERSION }}-v2

      - name: Build Halide (first run, ~30-60 min)
        if: steps.halide-restore.outputs.cache-hit != 'true'
        working-directory: ${{ env.FOTUFILM_ROOT }}
        env:
          FOTUFILM_BUILD_JOBS: 4
        run: |
          set -euxo pipefail
          bash tools/build-halide-linux.sh
          df -h /

      - name: Save Halide cache
        if: steps.halide-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party/fotufilm/build/halide-linux-install
          key: fotufilm-halide-${{ env.FOTUFILM_COMMIT }}-llvm${{ env.LLVM_VERSION }}-v2

      # `echo ... >> $GITHUB_ENV` 只对**后续**步骤生效，当前 shell 里是空值，
      # 所以先用显式路径校验，再写入 GITHUB_ENV。
      - name: Export Halide root
        run: |
          set -euxo pipefail
          HALIDE_INSTALL="$GITHUB_WORKSPACE/$FOTUFILM_ROOT/build/halide-linux-install"
          test -f "$HALIDE_INSTALL/include/Halide.h"
          # Debian 的 LLVM 开了 LLVM_LINK_LLVM_DYLIB，Halide 因此走 shared 模式产出 libHalide.so；
          # 若某天变成静态构建则只有 .a。两者都接受，但必须有其一。
          if [ -f "$HALIDE_INSTALL/lib/libHalide.so" ]; then
            echo "Halide link mode: shared"
          elif [ -f "$HALIDE_INSTALL/lib/libHalide.a" ]; then
            echo "Halide link mode: static"
          else
            ls -l "$HALIDE_INSTALL/lib" >&2 || true
            echo "libHalide.{so,a} not found" >&2
            exit 1
          fi
          echo "HALIDE_ROOT=$HALIDE_INSTALL" >> "$GITHUB_ENV"
          ls -1 "$HALIDE_INSTALL/lib" | head -20

      - name: Build Android CPU AOT kernels
        working-directory: ${{ env.FOTUFILM_ROOT }}
        run: |
          set -euxo pipefail
          mkdir -p build/android-kernels
          "${CXX:-clang++}" -std=c++17 -O2 \
            -I"$HALIDE_ROOT/include" \
            -ISources/FotufilmHalide/include \
            tools/generate_halide_android.cpp \
            -L"$HALIDE_ROOT/lib" -lHalide \
            -Wl,-rpath,"$HALIDE_ROOT/lib" \
            -o build/generate-android
          # 不传 --host = 真正的 arm64 Android 目标
          ./build/generate-android build/android-kernels
          ls -lh build/android-kernels
          test -n "$(ls -A build/android-kernels)"

      # 上游脚本会调用 CLI 生成 example.fswp，而该子命令在 Linux 上是 fail()。
      # shim 把请求解析到 macOS job 产出的同名 pack —— pack 是纯参数序列化，跨平台一致。
      - name: Run upstream Android AOT parity
        working-directory: ${{ env.FOTUFILM_ROOT }}
        env:
          # FOTUFILM_PACK_DIR 由上一步 Check packs 写入 GITHUB_ENV
          FOTUFILM_PARITY_CLI: ${{ github.workspace }}/.github/scripts/fotufilm-pack-shim.sh
        run: |
          set -o pipefail
          chmod +x "$FOTUFILM_PARITY_CLI"
          bash tools/verify-android-aot.sh 2>&1 | tee build/android-aot-parity.log

      # FOT-004：把 5 个 AOT 内核与上游 Android 适配层链成 .so。
      # 纯交叉编译，不需要设备；NDK 由前面的 Install Android NDK 步骤装好。
      #
      # configure 与 build 的输出都 tee 到文件：网页上的日志会被截断，截断时原始错误
      # （哪一行、哪个头、哪条 undeclared identifier）就只剩 artifact 里这一份。
      - name: Build libfotufilm_android.so
        run: |
          set -euxo pipefail
          mkdir -p build
          cmake -S "$GITHUB_WORKSPACE/native" -B build/so-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DFOTUFILM_ROOT="$GITHUB_WORKSPACE/$FOTUFILM_ROOT" \
            -DFOTUFILM_KERNELS="$GITHUB_WORKSPACE/$FOTUFILM_ROOT/build/android-kernels" \
            -DHALIDE_INCLUDE="$HALIDE_ROOT/include" 2>&1 | tee build/so-configure.log
          cmake --build build/so-arm64 --parallel 2>&1 | tee build/so-build.log
          test -f build/so-arm64/libfotufilm_android.so
          ls -lh build/so-arm64/libfotufilm_android.so

      # 三条硬断言。没有它们，"编出个 .so" 和 "能在手机上 loadLibrary" 是两回事。
      - name: Verify .so architecture and JNI exports
        run: |
          set -euxo pipefail
          SO=build/so-arm64/libfotufilm_android.so
          LLVM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$LLVM_BIN/llvm-readelf" -h "$SO" | tee build/so-headers.txt
          grep -q "Machine:.*AArch64" build/so-headers.txt
          echo "---- NEEDED ----"
          "$LLVM_BIN/llvm-readelf" -d "$SO" | grep NEEDED || true
          echo "---- 导出的 JNI 符号 ----"
          "$LLVM_BIN/llvm-nm" -D --defined-only "$SO" | tee build/so-symbols.txt
          # 9 个符号，一个都不能漏：之前这里只列了 8 个，漏掉 nativeAvailable，
          # 而它恰好是"引擎在本机可不可用"的探针，真机自测第一件事就是调它。
          for symbol in nativeAbiVersion nativeAvailable nativeOpenPack nativePackInfo \
                        nativeMaxHalo nativeProcess nativeProcessStrip nativeReleasePack \
                        nativeLastError; do
            grep -q "$symbol$" build/so-symbols.txt \
              || { echo "缺少 JNI 导出: $symbol" >&2; exit 1; }
          done
          # Halide 运行时若漏链，这里会暴露成未定义符号，而 --no-undefined 本该先拦住它。
          if "$LLVM_BIN/llvm-nm" -D --undefined-only "$SO" | grep -q " halide_"; then
            echo "存在未解析的 halide_* 符号：" >&2
            "$LLVM_BIN/llvm-nm" -D --undefined-only "$SO" | grep " halide_" >&2
            exit 1
          fi

      - name: Collect artifacts
        if: always()
        run: |
          set -x
          mkdir -p artifacts/aot artifacts/film artifacts/lib
          cp -R "$FOTUFILM_ROOT"/build/android-kernels/* artifacts/aot/ || true
          cp "$FOTUFILM_ROOT"/build/android-aot-parity.log artifacts/ || true
          cp "$FOTUFILM_ROOT"/build/android-parity/*.fswp artifacts/ || true
          cp "$FOTUFILM_ROOT"/build/android-parity/*.bin artifacts/ || true
          cp "${FOTUFILM_PACK_DIR:-prebuilt-packs}"/*.fswp artifacts/film/ || true
          cp build/so-arm64/libfotufilm_android.so artifacts/lib/ || true
          cp build/so-symbols.txt artifacts/lib/ || true
          # 编译失败时这两份才是最完整的证据，网页日志只是它们的截断版。
          cp build/so-configure.log artifacts/lib/ || true
          cp build/so-build.log artifacts/lib/ || true
          ls -lR artifacts | head -40

      # always()：即使 parity 断言失败，也要把已生成的 pack / kernels 带出来，
      # 否则一次 60 分钟的 run 只剩一个红叉，什么也拿不到。
      - name: Upload packs + AOT kernels + parity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotufilm-android-poc
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/film/*.fswp
            artifacts/aot/**
            artifacts/lib/**
            artifacts/android-aot-parity.log
            artifacts/*.bin

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fotufilm Android Phase 0"
            echo ""
            echo "- stocks: \`${{ inputs.stocks }}\`"
            echo "- packs: \`packs\` job 产出（macOS，ImageIO 只在那里可用）"
            echo "- Halide cache hit: \`${{ steps.halide-restore.outputs.cache-hit }}\`"
            echo "- parity: 见 job 日志中的 \`Run upstream Android AOT parity\`"
            echo ""
            echo "产物：\`fotufilm-android-poc\` artifact（packs / .a / parity log）"
            echo "注意：本 workflow **不产出** \`libfotufilm_android.so\`，那是 FOT-004。"
          } >> "$GITHUB_STEP_SUMMARY"
